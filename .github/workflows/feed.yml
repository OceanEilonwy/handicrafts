# Builds the handicrafts xbps feed for monokulo-nodo, signs it, and publishes it as the assets of
# the GitHub release `feed`. Devices add the feed at
#   https://github.com/OceanEilonwy/handicrafts/releases/download/feed
# and pin the key fingerprint below. README.md ("Running on monokulo-nodo") explains the feed, the
# key, and the one-time setup (the release, the environment and its secret). Adapted from
# Pingers' feed workflow, which feeds the same devices.
#
# Pull requests that touch the nodo packaging run only the `test` job: the feed app's files
# through nodo's own parsers (scripts/test-nodo-package.sh). The dist and build jobs compile
# third-party code and never see the signing key. Only the publish job does, in the `feed`
# environment, for a run on master or a feed-* tag, and only it can write to the repository
# (contents: write, for the release assets).
#
# Every commit is a new package version (the crate version and the commit count), so a run
# builds everything; it is started by hand or by pushing a `feed-*` tag, not by every push.
name: feed

on:
  workflow_dispatch:
  push:
    tags: ["feed-*"]
  pull_request:
    paths:
      - packaging/nodo/**
      - scripts/nodo-dist.sh
      - scripts/test-nodo-package.sh
      - .github/workflows/feed.yml

permissions:
  contents: read

concurrency:
  group: feed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # monokulo-nodo's builder, feed scripts and parsers: main with third-party feeds
  # (NODO_EXTRA_PACKAGES), the same commit scripts/test-nodo-package.sh is run against.
  NODO_REPOSITORY: OceanEilonwy/monokulo-nodo
  NODO_REV: fb50c357358c2e337391f3cdc017c8c97552f892
  # The feed key's fingerprint as xbps and nodo show it (MD5 of the key in SSH form). Its public
  # half is packaging/nodo/feed-signing-key.pub.pem.
  FEED_FINGERPRINT: "6a:ac:ee:8e:50:30:45:e6:2f:f8:29:f3:36:79:4e:93"
  FEED_SIGNER: handicrafts feed
  FEED_RELEASE: feed

jobs:
  test:
    name: nodo package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NODO_REPOSITORY }}
          ref: ${{ env.NODO_REV }}
          path: nodo
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nodo/target
          key: feed-test-${{ hashFiles('nodo/Cargo.lock') }}
          restore-keys: feed-test-

      - name: scripts/test-nodo-package.sh
        run: scripts/test-nodo-package.sh nodo

  dist:
    name: source tarball
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.dist.outputs.version }}
      commit: ${{ steps.dist.outputs.commit }}
    steps:
      # The whole history: the version counts the commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # git archive of this commit plus cargo vendor, and the recipe with its version and
      # checksum filled in.
      - name: scripts/nodo-dist.sh
        id: dist
        run: |
          scripts/nodo-dist.sh HEAD | tee -a "$GITHUB_OUTPUT"

      - name: Pack
        run: tar -cf dist.tar -C target/nodo srcpkgs "handicrafts-${{ steps.dist.outputs.commit }}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist.tar
          retention-days: 7
          if-no-files-found: error

  build:
    name: build ${{ matrix.arch }}
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # The runner is x86_64: x86_64 builds natively, aarch64 (the NanoPC-T6N) cross-compiles.
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NODO_REPOSITORY }}
          ref: ${{ env.NODO_REV }}
          path: nodo
          persist-credentials: false

      - name: Check the nodo checkout
        run: |
          grep -q NODO_EXTRA_PACKAGES nodo/scripts/lib.sh || {
            echo "::error::monokulo-nodo $NODO_REV has no NODO_EXTRA_PACKAGES; update NODO_REV"
            exit 1
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      # The tarball goes where xbps-src looks before fetching, so nothing is downloaded.
      - name: Place the source
        env:
          VERSION: ${{ needs.dist.outputs.version }}
          COMMIT: ${{ needs.dist.outputs.commit }}
        run: |
          mkdir -p target/nodo "nodo/build/hostdir/sources/handicrafts-$VERSION"
          tar -xf dist.tar -C target/nodo
          mv "target/nodo/handicrafts-$COMMIT.tar.gz" "nodo/build/hostdir/sources/handicrafts-$VERSION/"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Toolchains and xbps's package cache. Not the source tarball: it is new every run.
      - name: Restore the build cache
        id: hostdir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nodo/build/hostdir
            !nodo/build/hostdir/sources/handicrafts-*
            !nodo/build/hostdir/sccache
            !nodo/build/hostdir/ccache
          key: feed-hostdir-${{ matrix.arch }}-${{ hashFiles('packaging/nodo/srcpkgs/**', 'nodo/versions.env') }}
          restore-keys: feed-hostdir-${{ matrix.arch }}-

      # sccache (Rust, and the C of -sys crates) and ccache, bounded below so both architectures
      # fit GitHub's 10 GB per repository with the builder image.
      - name: Restore the compiler caches
        id: compile
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nodo/build/hostdir/sccache
            nodo/build/hostdir/ccache
          key: feed-compile-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/nodo/srcpkgs/**', 'nodo/versions.env') }}-${{ github.run_id }}
          restore-keys: |
            feed-compile-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/nodo/srcpkgs/**', 'nodo/versions.env') }}-
            feed-compile-${{ matrix.arch }}-

      - name: Restore the builder image
        id: builder
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nodo/build/builder-image.tar.zst
          key: feed-builder-${{ hashFiles('nodo/docker/builder.Dockerfile', 'nodo/versions.env') }}

      - name: Load the builder image
        if: steps.builder.outputs.cache-hit == 'true'
        run: zstd -dc nodo/build/builder-image.tar.zst | docker load

      - name: Build
        id: build
        env:
          SCCACHE_CACHE_SIZE: 1536M
          CCACHE_MAXSIZE: 256M
        run: |
          NODO_EXTRA_PACKAGES="$PWD/target/nodo/srcpkgs" FEED_PACKAGES="$PWD/packaging/nodo/feed-packages" \
            nodo/scripts/publish-feed.sh build "${{ matrix.arch }}"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome != 'skipped'
        with:
          path: |
            nodo/build/hostdir/sccache
            nodo/build/hostdir/ccache
          key: ${{ steps.compile.outputs.cache-primary-key }}

      - name: Save the builder image
        if: steps.builder.outputs.cache-hit != 'true'
        # lib.sh finds the nodo checkout from $0.
        run: |
          set -o pipefail
          # shellcheck disable=SC2016
          bash -c '. nodo/scripts/lib.sh && docker save "$(builder_tag)"' nodo/scripts/lib.sh | zstd -T0 -3 -o nodo/build/builder-image.tar.zst

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.builder.outputs.cache-hit != 'true'
        with:
          path: nodo/build/builder-image.tar.zst
          key: ${{ steps.builder.outputs.cache-primary-key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.hostdir.outputs.cache-hit != 'true'
        with:
          path: |
            nodo/build/hostdir
            !nodo/build/hostdir/sources/handicrafts-*
            !nodo/build/hostdir/sccache
            !nodo/build/hostdir/ccache
          key: ${{ steps.hostdir.outputs.cache-primary-key }}

      - name: Collect the feed's packages
        run: |
          mkdir -p "out/upload/${{ matrix.arch }}"
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' packaging/nodo/feed-packages | while read -r app; do
            cp "nodo/out/feed/${{ matrix.arch }}/$app"-[0-9]*.xbps "out/upload/${{ matrix.arch }}/"
          done
          ls -l "out/upload/${{ matrix.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-${{ matrix.arch }}
          path: out/upload/${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [dist, build]
    # Both architectures, or nothing: a device of either kind must find its packages.
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/feed-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: feed
      url: https://github.com/${{ github.repository }}/releases/tag/feed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NODO_REPOSITORY }}
          ref: ${{ env.NODO_REV }}
          path: nodo
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: feed-*
          path: out/artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: out/dist

      - name: Place the packages
        run: |
          for arch in aarch64 x86_64; do
            [ -d "out/artifacts/feed-$arch" ] || { echo "::error::no $arch packages"; exit 1; }
            mkdir -p "nodo/out/feed/$arch"
            mv "out/artifacts/feed-$arch"/*.xbps "nodo/out/feed/$arch/"
          done

      # The key exists only in this step, in a 0600 file under the runner's temp directory, and
      # reaches xbps-rindex read-only in a container without network (nodo's publish-feed.sh).
      - name: Sign
        env:
          HANDICRAFTS_FEED_SIGNING_KEY: ${{ secrets.HANDICRAFTS_FEED_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/feed-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$HANDICRAFTS_FEED_SIGNING_KEY" > "$key"
          FEED_PACKAGES="$PWD/packaging/nodo/feed-packages" FEED_SITE="$PWD/out/site" \
            nodo/scripts/publish-feed.sh sign "$key" aarch64 x86_64

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nodo/target
          key: feed-check-${{ hashFiles('nodo/Cargo.lock') }}
          restore-keys: feed-check-

      # Every package goes through the device's own install review, against the pinned
      # fingerprint, before anything is published.
      - name: Check as a device would
        run: |
          FEED_PACKAGES="$PWD/packaging/nodo/feed-packages" FEED_SITE="$PWD/out/site" \
            nodo/scripts/publish-feed.sh check aarch64 x86_64

      # New packages and signatures first, then the indexes, then whatever the new indexes no
      # longer name. A device that fetches mid-way sees the old index and its old packages, or
      # the new index and its new ones. The source tarball the packages were built from is
      # published beside them (GPL-3.0 corresponding source).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.dist.outputs.commit }}
        run: |
          gh release view "$FEED_RELEASE" > /dev/null || {
            echo "::error::create the release first: README.md, 'Running on monokulo-nodo'"
            exit 1
          }
          tar -xf out/dist/dist.tar -C out/dist "handicrafts-$COMMIT.tar.gz"
          cp packaging/nodo/feed-signing-key.pub.pem out/site/feed/handicrafts-feed.pub.pem
          cp "out/dist/handicrafts-$COMMIT.tar.gz" out/site/feed/
          cd out/site/feed
          ls -l
          find . -maxdepth 1 -type f ! -name '*-repodata' -printf '%f\n' | sort > ../new-assets
          xargs -a ../new-assets gh release upload "$FEED_RELEASE" --clobber
          gh release upload "$FEED_RELEASE" --clobber ./*-repodata
          gh release view "$FEED_RELEASE" --json assets --jq '.assets[].name' | while read -r asset; do
            case $asset in *-repodata) continue ;; esac
            grep -qxF "$asset" ../new-assets || gh release delete-asset "$FEED_RELEASE" "$asset" --yes
          done
          echo "published $(wc -l < ../new-assets) files and the indexes for $COMMIT"
